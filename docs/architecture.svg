<text x="120" y="960" font-family="Arial,sans-serif" font-size="30" fill="#172731">The model proposes. The code decides. The streamer approves.</text>
<text x="120" y="1008" font-family="Arial,sans-serif" font-size="23" fill="#526674">Untrusted chat, pages and transcripts enter labelled JSON. Public quotes come from verified source text or stored transcript segments.</text>
