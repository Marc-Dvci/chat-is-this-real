name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run eval:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run worker:check
        env:
          WRANGLER_SEND_METRICS: 'false'

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag chat-is-this-real:test .
      - name: Run the recorded demo from the built image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chat-is-this-real-check --publish 127.0.0.1:4748:4747 chat-is-this-real:test node dist/server/index.js --demo
          trap 'docker logs chat-is-this-real-check; docker rm --force chat-is-this-real-check' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4748/api/health > /tmp/chat-is-this-real-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then exit 1; fi
          node -e "const fs=require('node:fs');const h=JSON.parse(fs.readFileSync('/tmp/chat-is-this-real-health.json','utf8'));if(h.status!=='ok')process.exit(1)"
          curl --fail --silent http://127.0.0.1:4748/ > /tmp/chat-is-this-real-index.html
          grep -q '/assets/' /tmp/chat-is-this-real-index.html
          curl --fail --silent http://127.0.0.1:4748/api/desk > /tmp/chat-is-this-real-desk.json
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync('/tmp/chat-is-this-real-desk.json','utf8'));if(!d.demo||!d.checks.some(c=>c.input.claim.includes('stardew sur PC')))process.exit(1)"
          docker exec chat-is-this-real-check ffmpeg -version > /dev/null
